[project]
name = "telethon-template"
version = "0.1.0"
description = "Simple Telethon client template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon==1.42.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "colorlog>=6.8.2",
]

[project.scripts]
bot = "app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
