name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The image name is resolved in every job: job outputs that contain a secret
# (the username may be one) are dropped by GitHub.
env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: >-
    ${{ vars.DOCKERHUB_IMAGE || format('{0}/{1}',
    vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'local',
    github.event.repository.name) }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run --frozen ruff check src

      - name: Ruff format
        run: uv run --frozen ruff format --check src

      - name: Tests
        run: uv run --frozen pytest -q

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          name="${IMAGE_NAME,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ref=${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Relative to the SSH user's home directory unless an absolute path is given.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'chat-engine' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        run: echo "APP_IMAGE=${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [[ -n $SSH_KNOWN_HOSTS ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set, trusting the host key reported by ssh-keyscan"
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload deploy files
        run: |
          ssh deploy "mkdir -p '${DEPLOY_PATH}'"
          scp docker-compose.yml deploy/deploy.sh "deploy:${DEPLOY_PATH}/"

      - name: Deploy
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh deploy \
            "cd '${DEPLOY_PATH}' && APP_IMAGE='${APP_IMAGE}' REGISTRY_USER='${DOCKERHUB_USERNAME}' bash deploy.sh"
